[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "test-me-automation"
version = "0.1.0"
description = "UI and API automation for the Test Me training storefront"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "requests>=2.32",
    "selenium>=4.25",
]

[project.optional-dependencies]
dev = [
    "pytest-xdist>=3.6",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "api: API contract and business behavior tests",
    "ui: browser-driven UI tests",
    "smoke: high-value smoke coverage",
    "regression: regression coverage for confirmed behavior",
    "negative: invalid input and error behavior",
    "serial: avoid parallel execution for this test",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
